name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'release')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read and verify release metadata
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Git tag and package version do not match.'
          }
          if (-not (Test-Path -LiteralPath ".github/release-notes/v$version.md" -PathType Leaf)) {
            throw "Release notes for v$version are missing."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install

      - name: Run regression tests
        run: npm test

      - name: Build with electron-builder
        run: npm run dist

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/markdown-editor-setup-${{ steps.package.outputs.version }}.exe
            release/markdown-editor-portable-${{ steps.package.outputs.version }}.exe
            release/markdown-editor-setup-${{ steps.package.outputs.version }}.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
          tag_name: v${{ steps.package.outputs.version }}
          body_path: .github/release-notes/v${{ steps.package.outputs.version }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
