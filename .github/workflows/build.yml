name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'release')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install

      - name: Build with electron-builder
        run: npm run dist

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          tag_name: v${{ steps.package.outputs.version }}
          generate_release_notes: false
          body: |
            ## v${{ steps.package.outputs.version }}

            ### 中文

            此版本修复 PDF 导出在选择保存路径后未生成文件的问题，并完成 HTML/PDF 实际保存验证。

            #### 下载

            | 文件 | 说明 |
            |------|------|
            | `*-setup.exe` | **安装版（推荐）**：提供安装向导并创建桌面快捷方式 |
            | `*-portable.exe` | **便携版**：无需安装，可直接运行 |

            #### 更新亮点

            - PDF 导出改用临时 HTML 文件加载，避开超长 `data:` URL 限制。
            - 支持包含内嵌字体、KaTeX 和 Mermaid 的较大文档导出。
            - 导出完成后自动清理临时文件和打印窗口。
            - 新增大文档 PDF 导出回归测试。
            - 实际验证 HTML 与 PDF 均可保存并生成有效文件。

            ### English

            This release fixes PDF exports that did not create a file after a save path was selected, with end-to-end HTML and PDF save verification.

            #### Downloads

            | File | Description |
            |------|-------------|
            | `*-setup.exe` | **Installer (recommended)**: includes a setup wizard and desktop shortcut |
            | `*-portable.exe` | **Portable build**: runs directly without installation |

            #### Highlights

            - Load PDF export content from a temporary HTML file instead of a length-limited `data:` URL.
            - Support larger documents containing embedded fonts, KaTeX, and Mermaid output.
            - Clean up the temporary file and print window after each export.
            - Add a regression test for large-document PDF exports.
            - Verify that both HTML and PDF exports create valid saved files.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
